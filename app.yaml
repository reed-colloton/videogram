runtime: nodejs24
instance_class: F2
entrypoint: npm start

env_variables:
  OPENROUTER_SECRET_NAME: videogram-openrouter-api-key

automatic_scaling:
  min_instances: 0
  max_instances: 2
  max_concurrent_requests: 10

handlers:
  - url: /.*
    script: auto
    secure: always
    redirect_http_response_code: 301
